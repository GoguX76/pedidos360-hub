name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"

permissions:
  contents: read

concurrency:
  group: production-deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: 34.230.203.32
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_PRIVATE_KEY" || {
            echo "::error::Configure el secret EC2_SSH_PRIVATE_KEY."
            exit 1
          }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ec2_key"
          chmod 600 "$RUNNER_TEMP/ec2_key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload and deploy frontend
        env:
          KEY_PATH: ${{ runner.temp }}/ec2_key
          EC2_HOST: 34.230.203.32
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/frontend.tar.gz"
          tar -czf "$archive" -C frontend/dist/frontend/browser .
          remote_archive="/home/ec2-user/frontend-${GITHUB_SHA}.tar.gz"
          scp -i "$KEY_PATH" "$archive" "ec2-user@${EC2_HOST}:${remote_archive}"
          ssh -i "$KEY_PATH" "ec2-user@${EC2_HOST}" \
            "GITHUB_SHA='${GITHUB_SHA}' REMOTE_ARCHIVE='${remote_archive}' bash -s" <<'REMOTE'
          set -euo pipefail
          mapfile -t containers < <(docker ps --filter publish=8080 --format '{{.Names}}')
          if [ "${#containers[@]}" -ne 1 ]; then
            echo "Expected exactly one running container publishing port 8080; found ${#containers[@]}."
            exit 1
          fi
          container="${containers[0]}"
          stage="/tmp/frontend-${GITHUB_SHA}"
          mkdir -p "$stage"
          tar -xzf "$REMOTE_ARCHIVE" -C "$stage"
          test -s "$stage/index.html"
          docker exec "$container" nginx -t
          docker cp "$stage/." "$container:/usr/share/nginx/html/"
          docker exec "$container" nginx -s reload
          curl -fsS http://localhost:8080/ >/dev/null
          rm -rf "$stage" "$REMOTE_ARCHIVE"
          REMOTE
