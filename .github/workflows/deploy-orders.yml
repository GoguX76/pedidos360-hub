name: Deploy orders

on:
  push:
    branches:
      - main
    paths:
      - "backend/orders/**"
      - "backend/common-messaging/**"

permissions:
  contents: read

concurrency:
  group: production-deploy-orders
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy orders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Prepare SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: 50.19.219.43
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_PRIVATE_KEY" || {
            echo "::error::Configure el secret EC2_SSH_PRIVATE_KEY."
            exit 1
          }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ec2_key"
          chmod 600 "$RUNNER_TEMP/ec2_key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Build and deploy orders
        working-directory: backend/orders
        env:
          KEY_PATH: ${{ runner.temp }}/ec2_key
          ORDERS_IP: 50.19.219.43
          DB_URL: ${{ secrets.ORDERS_DB_URL }}
          DB_USER: ${{ secrets.ORDERS_DB_USER }}
          DB_PASSWORD: ${{ secrets.ORDERS_DB_PASSWORD }}
          RABBITMQ_HOST: ${{ secrets.ORDERS_RABBITMQ_HOST }}
          RABBITMQ_PORT: ${{ secrets.ORDERS_RABBITMQ_PORT }}
          RABBITMQ_USER: ${{ secrets.ORDERS_RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DB_URL DB_USER DB_PASSWORD RABBITMQ_HOST RABBITMQ_PORT RABBITMQ_USER RABBITMQ_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure the secret mapped to $name for orders."
              exit 1
            fi
          done
          chmod +x deploy-ec2.sh
          ./deploy-ec2.sh
