name: Deploy RabbitMQ Admin

on:
  push:
    branches:
      - main
    paths:
      - "backend/rabbitmq-admin/**"

permissions:
  contents: read

concurrency:
  group: production-deploy-rabbitmq-admin
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy RabbitMQ Admin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Prepare SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: 3.233.100.195
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_PRIVATE_KEY" || {
            echo "::error::Configure el secret EC2_SSH_PRIVATE_KEY."
            exit 1
          }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ec2_key"
          chmod 600 "$RUNNER_TEMP/ec2_key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Build and deploy RabbitMQ Admin
        working-directory: backend/rabbitmq-admin
        env:
          KEY_PATH: ${{ runner.temp }}/ec2_key
          ADMIN_IP: 3.233.100.195
          SPRING_PROFILES_ACTIVE: prod
          RABBITMQ_HOST: rabbit1
          RABBITMQ_PORT: "5672"
          RABBITMQ_USER: ${{ secrets.RABBITMQ_ADMIN_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASSWORD }}
          ADMIN_NETWORK: rabbitnet
        run: |
          set -euo pipefail
          for name in RABBITMQ_USER RABBITMQ_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure the secret mapped to $name for RabbitMQ Admin."
              exit 1
            fi
          done
          chmod +x deploy-ec2.sh
          ./deploy-ec2.sh
