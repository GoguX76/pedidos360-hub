spring.application.name=orders
server.port=8081
spring.profiles.active=dev

# Actuator
management.endpoints.web.exposure.include=health,info

# Seguridad: validacion de tokens v1 de Microsoft Entra ID (ver JwtDecoderConfig).
# NO usar issuer-uri: el discovery declara issuer login.microsoftonline.com/...
# pero el token trae iss sts.windows.net/... y Spring exige igualdad exacta.
# Se valida firma con el JWK Set + issuer v1 y audience explicitos.
azure.tenant-id=${AZURE_TENANT_ID:6a3978a5-1a22-4be4-bbb8-a7c6279c471e}
azure.jwk-set-uri=https://login.microsoftonline.com/${azure.tenant-id}/discovery/v2.0/keys
azure.v1-issuer=https://sts.windows.net/${azure.tenant-id}/
azure.api-audience=${AZURE_API_AUDIENCE:api://4d1afbc7-9d81-4ef4-a0e2-fd0ec724f8f4}

# CORS: origenes permitidos para el frontend Angular
app.cors.allowed-origins=http://localhost:4200
