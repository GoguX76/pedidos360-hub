spring.application.name=orders
server.port=8081
spring.profiles.active=dev

# Actuator
management.endpoints.web.exposure.include=health,info

# Seguridad: validacion de tokens de Microsoft Entra ID (Resource Server)
# Token v1 (iss = https://sts.windows.net/<tenant>/): discovery v1 sin /v2.0
# El aud del token es el URI completo api://<clientId>
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/6a3978a5-1a22-4be4-bbb8-a7c6279c471e}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AUDIENCES:api://4d1afbc7-9d81-4ef4-a0e2-fd0ec724f8f4}

# CORS: origenes permitidos para el frontend Angular
app.cors.allowed-origins=http://localhost:4200
