# PostgreSQL de produccion
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# CORS: origenes permitidos para el frontend Angular (prod).
# Sin esta propiedad SecurityConfig falla al arrancar (@Value sin default).
app.cors.allowed-origins=https://34.230.203.32,http://localhost:4200