spring.application.name=rabbitmq-admin
server.port=8083
spring.profiles.active=dev

# Actuator
management.endpoints.web.exposure.include=health,info

# Seguridad: validacion de tokens v1 de Microsoft Entra ID (ver JwtDecoderConfig).
azure.tenant-id=${AZURE_TENANT_ID:6a3978a5-1a22-4be4-bbb8-a7c6279c471e}
azure.jwk-set-uri=https://login.microsoftonline.com/${azure.tenant-id}/discovery/v2.0/keys
azure.v1-issuer=https://sts.windows.net/${azure.tenant-id}/
azure.api-audience=${AZURE_API_AUDIENCE:api://4d1afbc7-9d81-4ef4-a0e2-fd0ec724f8f4}

# CORS: origenes permitidos para el frontend Angular
app.cors.allowed-origins=http://localhost:4200

# RabbitMQ (parametrizable por variables de entorno)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:pedidos}
spring.rabbitmq.password=${RABBITMQ_PASS:pedidos360}
