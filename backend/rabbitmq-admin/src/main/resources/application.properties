spring.application.name=rabbitmq-admin
server.port=8083

# RabbitMQ (parametrizable por variables de entorno)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:pedidos}
spring.rabbitmq.password=${RABBITMQ_PASS:pedidos360}

management.endpoints.web.exposure.include=health,info
