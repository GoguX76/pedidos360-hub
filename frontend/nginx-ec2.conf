server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/pedidos360.crt;
    ssl_certificate_key /etc/nginx/ssl/pedidos360.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy mismo-origen hacia el API Gateway: evita CORS en el navegador.
    # (El fix real — habilitar CORS en el gateway — sigue pendiente del líder en AWS.)
    location /api/ {
        proxy_pass https://y2fmjg2ed2.execute-api.us-east-1.amazonaws.com;
        proxy_ssl_server_name on;
        proxy_set_header Host y2fmjg2ed2.execute-api.us-east-1.amazonaws.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|txt)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
